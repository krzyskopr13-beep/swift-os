name: Build SwiftOS
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build SwiftOS Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Image with Container Boot
        uses: docker/build-push-action@v5
        with:
          context: .
          file: recipe.yml
          push: false
