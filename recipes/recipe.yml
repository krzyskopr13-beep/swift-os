# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: swift-os
description: Bezkompromisowy system dla graczy z maksymalna optymalizacja FPS i RAM

# Wracamy do bazy, tak jak chciał w tym logu
base-image: ghcr.io/ublue-os/arch-dx
image-version: latest

# Zostawiamy nowoczesne moduły
modules:
  - type: rpm-ostree
    install:
      - thorium-browser
      - gnome-terminal
      - steam
      - lutris
      - heroic-games-launcher-bin
      - gamemode
      - gamescope
      - nvidia-open
      - mesa
