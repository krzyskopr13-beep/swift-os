# yaml-language-server: $schema=https://blue-build.org
name: swift-os
description: Bezkompromisowy system dla graczy z maksymalna optymalizacja FPS i RAM

# Używamy oficjalnej bazy z gotowym wsparciem Nvidia i tagiem latest
base-image: ghcr.io/ublue-os/kinoite-nvidia
image-version: latest

modules:
  - type: rpm-ostree
    install:
      - chromium
      - steam
      - gamemode
      - gamescope
