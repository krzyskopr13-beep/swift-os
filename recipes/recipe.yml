# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: swift-os
description: Bezkompromisowy system dla graczy z maksymalna optymalizacja FPS i RAM

# Poprawne wskazanie bazy i wersji
from: ghcr.io/ublue-os/arch-dx
image-version: latest

# Nowy, poprawny format instalacji pakietów dla BlueBuild
modules:
  - type: rpm-ostree
    install:
      - thorium-browser
      - gnome-terminal
      - steam
      - lutris
      - heroic-games-launcher-bin
      - gamemode
      - gamescope
      - nvidia-open
      - mesa
