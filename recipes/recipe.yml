# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: swift-os
description: Bezkompromisowy system dla graczy z maksymalna optymalizacja FPS i RAM

# Oficjalna i poprawna ścieżka do stabilnego obrazu bazowego Kinoite (Fedora 40)
base-image: ghcr.io/ublue-os/kinoite-main
image-version: '40'

modules:
  - type: rpm-ostree
    install:
      - chromium
      - steam
      - gamemode
      - gamescope
      - akmod-nvidia
