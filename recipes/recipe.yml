# yaml-language-server: $schema=https://blue-build.org
name: swift-os
description: Bezkompromisowy system dla graczy z maksymalna optymalizacja FPS i RAM

# Bierzemy za baze stabilna, atomowa Fedore z srodowiskiem KDE Plasma
base-image: ghcr.io/ublue-os/kinoite-main
image-version: 40

modules:
  - type: rpm-ostree
    install:
      - steam
      - gamemode
      - gamescope
      - akmod-nvidia # Oficjalne sterowniki Nvidia dla Twojego GTX i RTX taty

  - type: default-flatpaks
    install:
      - org.chromium.Chromium
